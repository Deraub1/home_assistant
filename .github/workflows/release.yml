name: Publish downloadable apps

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run windows:dist

      - name: Name release asset
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'artifacts/windows' -Filter 'Home Assistant Setup *.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          Copy-Item $installer.FullName 'artifacts/windows/Home-Assistant-Setup.exe'

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/windows/Home-Assistant-Setup.exe

  android:
    name: Build signed Android APK
    if: ${{ vars.ANDROID_RELEASE_ENABLED == 'true' }}
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install dependencies and sync Android app
        run: |
          npm ci
          npm run android:sync

      - name: Prepare Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Configure the Android signing secrets before enabling Android releases."; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/home-assistant-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/home-assistant-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Name Android release asset
        run: cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/Home-Assistant-Android.apk

      - name: Upload Android APK to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/Home-Assistant-Android.apk
