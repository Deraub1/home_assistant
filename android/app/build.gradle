import java.awt.RenderingHints
import java.awt.image.BufferedImage
import javax.imageio.ImageIO

apply plugin: 'com.android.application'

def adaptiveIconSource = rootProject.file('../public/favicon-tab.png')
def adaptiveIconResourceDir = layout.buildDirectory.dir('generated/res/adaptiveIcon')
def adaptiveIconOutput = adaptiveIconResourceDir.get().file('drawable-nodpi/ic_launcher_adaptive_foreground.png').asFile
def legacyIconSizes = [mdpi: 48, hdpi: 72, xhdpi: 96, xxhdpi: 144, xxxhdpi: 192]
def legacyIconOutputs = legacyIconSizes.collectEntries { density, size ->
    [(density): [
        adaptiveIconResourceDir.get().file("mipmap-${density}/ic_launcher.png").asFile,
        adaptiveIconResourceDir.get().file("mipmap-${density}/ic_launcher_round.png").asFile
    ]]
}

android {
    namespace = "com.homeassistant.ledcontroller"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.homeassistant.ledcontroller"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 10
        versionName "1.0.13"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            res.srcDir(adaptiveIconResourceDir)
        }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('ANDROID_KEYSTORE_PATH') ?: 'release-key.jks')
            storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('ANDROID_KEY_ALIAS') ?: ''
            keyPassword System.getenv('ANDROID_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        debug {
            if (project.hasProperty('iconPreview')) {
                applicationIdSuffix '.preview'
                versionNameSuffix '-preview'
            }
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

def generateAdaptiveIcon = tasks.register('generateAdaptiveIcon') {
    inputs.file(adaptiveIconSource)
    outputs.files([adaptiveIconOutput] + legacyIconOutputs.values().flatten())

    doLast {
        def source = ImageIO.read(adaptiveIconSource)
        if (source == null || source.width != 180 || source.height != 180) {
            throw new GradleException('public/favicon-tab.png must be a readable 180x180 PNG.')
        }

        def renderHints = [
            (RenderingHints.KEY_INTERPOLATION): RenderingHints.VALUE_INTERPOLATION_BICUBIC,
            (RenderingHints.KEY_RENDERING): RenderingHints.VALUE_RENDER_QUALITY,
            (RenderingHints.KEY_ALPHA_INTERPOLATION): RenderingHints.VALUE_ALPHA_INTERPOLATION_QUALITY
        ]
        def drawCentered = { graphics, targetSize, artworkScale ->
            int artworkSize = Math.round(targetSize * artworkScale)
            int offset = (targetSize - artworkSize).intdiv(2)
            graphics.setRenderingHints(renderHints)
            graphics.drawImage(source, offset, offset, artworkSize, artworkSize, null)
        }
        def writePng = { BufferedImage image, File output ->
            if (!output.parentFile.mkdirs() && !output.parentFile.isDirectory()) {
                throw new GradleException("Could not create Android icon resource directory: ${output.parentFile}")
            }
            if (!ImageIO.write(image, 'png', output)) {
                throw new GradleException("Could not write Android icon resource: ${output}")
            }
        }

        def adaptiveForeground = new BufferedImage(1024, 1024, BufferedImage.TYPE_INT_ARGB)
        def foregroundGraphics = adaptiveForeground.createGraphics()
        try {
            drawCentered(foregroundGraphics, 1024, 0.80)
        } finally {
            foregroundGraphics.dispose()
        }
        writePng(adaptiveForeground, adaptiveIconOutput)

        legacyIconSizes.each { density, size ->
            legacyIconOutputs[density].each { output ->
                def legacyIcon = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB)
                def graphics = legacyIcon.createGraphics()
                try {
                    graphics.setColor(new java.awt.Color(7, 19, 38))
                    graphics.fillRect(0, 0, size, size)
                    drawCentered(graphics, size, 0.80)
                } finally {
                    graphics.dispose()
                }
                writePng(legacyIcon, output)
            }
        }
    }
}

tasks.named('preBuild').configure {
    dependsOn(generateAdaptiveIcon)
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
